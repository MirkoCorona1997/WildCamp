<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WildCamp</title>
  <link rel="icon" href="icon-180.png" />
  <link href="maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #102019; }
    #map { position: absolute; inset: 0; }
    .bar {
      position: absolute; z-index: 2; top: calc(8px + env(safe-area-inset-top));
      left: 8px; right: 8px; display: flex; gap: 6px; align-items: center;
    }
    form { flex: 1; display: flex; min-width: 0; background: #fff; border-radius: 999px; overflow: hidden; }
    input { flex: 1; border: 0; outline: none; font: 14px system-ui, sans-serif; padding: 8px 12px; min-width: 0; }
    button { border: 0; background: #14241c; color: #f4ecdf; font: 600 13px system-ui, sans-serif; }
    form button { padding: 0 12px; }
    #here { border-radius: 999px; padding: 8px 10px; white-space: nowrap; }
    .bar { z-index: 8; }
    .sheet { z-index: 8; }
    #ver { position: absolute; z-index: 8; top: calc(52px + env(safe-area-inset-top)); right: 10px; color: #5d564c; font: 10px system-ui; }
    .card { position: absolute; z-index: 3; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); background: #fff; color: #14241c; border-radius: 16px; padding: 10px; display: none; font: 14px system-ui, sans-serif; }
    .card.show { display: block; }
    .card b { display: block; margin-bottom: 8px; }
    .icons, .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .icons button, .acts button, .acts a { border-radius: 999px; padding: 8px 10px; background: #efe6d8; color: #14241c; text-decoration: none; }
    .acts a { background: #e3a14a; }
    .pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .aim { width: 16px; height: 16px; border: 3px solid #e24b4b; border-radius: 50%; background: rgba(226,75,75,.25); box-shadow: 0 0 0 2px #fff; }
    .sheet { position: absolute; z-index: 3; left: 8px; right: 8px; top: calc(52px + env(safe-area-inset-top)); background: #fff; border-radius: 14px; padding: 8px; display: none; }
    .sheet.show { display: flex; gap: 6px; flex-wrap: wrap; }
    .sheet button { border-radius: 999px; padding: 6px 8px; background: #efe6d8; color: #14241c; }
    .sheet button.off { opacity: .35; }
    .me { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 18px solid #1d6fd4; filter: drop-shadow(0 0 2px #fff); }
    #list { display: none; position: absolute; inset: 0; z-index: 9; background: #102019; color: #f4ecdf; padding: calc(10px + env(safe-area-inset-top)) 10px 12px; overflow: auto; font: 14px system-ui, sans-serif; }
    #list.show { display: block; }
    #list header { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    #list header button, #list .row button { background: #efe6d8; color: #14241c; border-radius: 999px; padding: 8px 10px; }
    #list .icons button { background: #efe6d8; color: #14241c; }
    #list .icons button.off { opacity: .35; }
    .row { background: #1b3328; border-radius: 14px; padding: 10px; margin: 8px 0; }
    .row b { display: block; }
    .row textarea { width: 100%; min-height: 52px; border: 0; border-radius: 10px; padding: 8px; margin-top: 6px; }
    .photo { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-top: 6px; }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="bar">
    <form id="search">
      <input id="q" placeholder="Cerca in Sardegna" autocomplete="off" />
      <button type="submit">Vai</button>
    </form>
    <button type="button" id="here">Posizione</button>
    <button type="button" id="filters">Filtri</button>
    <button type="button" id="openList">Lista</button>
  </div>
  <div id="ver">v27</div>
  <section class="sheet" id="sheet"></section>
  <section class="card" id="card"></section>
  <section id="list"></section>
</div>
<script src="maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "© OpenStreetMap"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [9.05, 40.05],
  zoom: 7.4,
  maxBounds: [[7.9, 38.75], [10.0, 41.4]]
});
map.addControl(new maplibregl.NavigationControl(), "bottom-right");

document.getElementById("search").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&viewbox=7.9,41.4,10.0,38.75&bounded=1&q=" + encodeURIComponent(q + ", Sardegna");
  const rows = await (await fetch(url, { headers: { "Accept-Language": "it" } })).json();
  if (!rows[0]) return;
  map.flyTo({ center: [+rows[0].lon, +rows[0].lat], zoom: 13 });
};

let marker = null;
let heading = 0;
function arrow() {
  const el = document.createElement("div");
  el.className = "me";
  el.style.transform = "rotate(" + heading + "deg)";
  return el;
}
function place(lng, lat) {
  if (marker) marker.remove();
  marker = new maplibregl.Marker({ element: arrow(), rotationAlignment: "map" }).setLngLat([lng, lat]).addTo(map);
}
document.getElementById("here").onclick = () => {
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().catch(() => {});
  }
  navigator.geolocation.watchPosition((pos) => {
    const lng = pos.coords.longitude;
    const lat = pos.coords.latitude;
    if (pos.coords.heading != null && !Number.isNaN(pos.coords.heading)) heading = pos.coords.heading;
    place(lng, lat);
    map.easeTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14) });
  }, () => {}, { enableHighAccuracy: true });
};
window.addEventListener("deviceorientation", (e) => {
  if (e.webkitCompassHeading != null) heading = e.webkitCompassHeading;
  else if (e.alpha != null) heading = (360 - e.alpha) % 360;
  if (marker) place(marker.getLngLat().lng, marker.getLngLat().lat);
});

const ICONS = [
  ["tenda", "⛺", "#2f8a60"],
  ["acqua", "💧", "#2d8ec8"],
  ["doccia", "🚿", "#3ec1c9"],
  ["cestino", "🗑️", "#7d9a52"],
  ["albero", "🌳", "#3f7d46"],
  ["domanda", "❓", "#c9a35c"]
];
const spots = JSON.parse(localStorage.getItem("wildcamp-spots") || "[]");
const pins = [];
const hidden = new Set(JSON.parse(localStorage.getItem("wildcamp-hidden") || "[]"));
let aim = null;
function hideAim() { if (aim) { aim.remove(); aim = null; } }
function showAim(lng, lat) {
  hideAim();
  const el = document.createElement("div");
  el.className = "aim";
  aim = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
}
function closeCard() {
  document.getElementById("card").className = "card";
  hideAim();
}
function pickPhoto(s, done) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 640 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      s.photo = canvas.toDataURL("image/jpeg", 0.7);
      saveSpots();
      if (done) done();
    };
    img.src = URL.createObjectURL(file);
  };
  input.click();
}
function openSpotCard(s) {
  const card = document.getElementById("card");
  card.className = "card show";
  card.innerHTML = "<b>" + s.lat.toFixed(5) + ", " + s.lng.toFixed(5) + "</b>" +
    (s.photo ? "<img class='photo' src='" + s.photo + "'>" : "") +
    "<div class='acts'><button type='button' id='photo'>Foto</button><button type='button' id='del'>Togli segnaposto</button><a href='https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng + "'>Naviga</a><button type='button' id='close'>Chiudi</button></div>";
  document.getElementById("photo").onclick = () => pickPhoto(s, () => openSpotCard(s));
  document.getElementById("del").onclick = () => {
    const n = spots.findIndex(x => x.uid === s.uid);
    if (n >= 0) spots.splice(n, 1);
    saveSpots();
    drawSpots();
    closeCard();
  };
  document.getElementById("close").onclick = closeCard;
}
function drawSpots() {
  pins.forEach(p => p.remove());
  pins.length = 0;
  spots.forEach((s) => {
    if (hidden.has(s.id)) return;
    const el = document.createElement("div");
    el.className = "pin";
    el.textContent = s.emoji;
    el.style.background = s.color;
    el.dataset.uid = String(s.uid);
    pins.push(new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map));
  });
}
document.getElementById("filters").onclick = (ev) => {
  ev.stopPropagation();
  const sheet = document.getElementById("sheet");
  const open = sheet.classList.toggle("show");
  if (!open) return;
  sheet.innerHTML = ICONS.map(i => "<button type='button' data-f='" + i[0] + "' class='" + (hidden.has(i[0]) ? "off" : "") + "'>" + i[1] + "</button>").join("");
  sheet.querySelectorAll("button").forEach(b => b.onclick = (ev2) => {
    ev2.stopPropagation();
    if (hidden.has(b.dataset.f)) hidden.delete(b.dataset.f); else hidden.add(b.dataset.f);
    localStorage.setItem("wildcamp-hidden", JSON.stringify([...hidden]));
    drawSpots();
    b.className = hidden.has(b.dataset.f) ? "off" : "";
  });
};

function saveSpots() { localStorage.setItem("wildcamp-spots", JSON.stringify(spots)); }
function backupFile() {
  const blob = new Blob([JSON.stringify({ spots: spots, saved: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wildcamp-backup.json";
  a.click();
  localStorage.setItem("wildcamp-backup-at", String(Date.now()));
}
function maybeWeeklyBackup() {
  const last = Number(localStorage.getItem("wildcamp-backup-at") || 0);
  if (Date.now() - last > 7 * 24 * 60 * 60 * 1000) backupFile();
}
function renderList() {
  const box = document.getElementById("list");
  const rows = spots.filter(s => !hidden.has(s.id));
  box.innerHTML = "<header><button type='button' id='closeList'>Mappa</button><button type='button' id='loadBackup'>Carica backup</button></header><div class='icons'>" +
    ICONS.map(i => "<button type='button' data-f='" + i[0] + "' class='" + (hidden.has(i[0]) ? "off" : "") + "'>" + i[1] + "</button>").join("") +
    "</div>" + (rows.length ? rows.map(s => "<div class='row' data-uid='" + s.uid + "'><b>" + s.emoji + " " + s.lat.toFixed(5) + ", " + s.lng.toFixed(5) + "</b>" + (s.photo ? "<img class='photo' src='" + s.photo + "'>" : "") + "<textarea data-note='" + s.uid + "' placeholder='Nota'>" + (s.note || "") + "</textarea><button type='button' data-photo='" + s.uid + "'>Foto</button></div>").join("") : "<p>Nessun segnaposto</p>");
  document.getElementById("closeList").onclick = () => box.classList.remove("show");
  box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    if (hidden.has(b.dataset.f)) hidden.delete(b.dataset.f); else hidden.add(b.dataset.f);
    localStorage.setItem("wildcamp-hidden", JSON.stringify([...hidden]));
    drawSpots();
    renderList();
  });
  box.querySelectorAll("[data-photo]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const s = spots.find(x => String(x.uid) === b.dataset.photo);
    if (s) pickPhoto(s, renderList);
  });
  box.querySelectorAll(".row").forEach(row => row.onclick = (ev) => {
    if (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "BUTTON" || ev.target.tagName === "IMG") return;
    const s = spots.find(x => String(x.uid) === row.dataset.uid);
    if (!s) return;
    box.classList.remove("show");
    map.flyTo({ center: [s.lng, s.lat], zoom: 14 });
    openSpotCard(s);
  });
  box.querySelectorAll("textarea").forEach(el => el.onchange = () => {
    const s = spots.find(x => String(x.uid) === el.dataset.note);
    if (!s) return;
    s.note = el.value;
    saveSpots();
  });
  document.getElementById("loadBackup").onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const data = JSON.parse(reader.result);
        const rows = Array.isArray(data) ? data : (data.spots || []);
        rows.forEach(r => { if (r.lat != null && r.lng != null) spots.push(r); });
        saveSpots();
        drawSpots();
        renderList();
      };
      reader.readAsText(file);
    };
    input.click();
  };
}
document.getElementById("openList").onclick = () => { renderList(); document.getElementById("list").classList.add("show"); };
maybeWeeklyBackup();

map.on("load", drawSpots);
map.on("click", (e) => {
  const pin = e.originalEvent && e.originalEvent.target && e.originalEvent.target.closest && e.originalEvent.target.closest(".pin");
  if (pin) {
    const s = spots.find(x => String(x.uid) === pin.dataset.uid);
    if (s) openSpotCard(s);
    return;
  }
  const lat = e.lngLat.lat;
  const lng = e.lngLat.lng;
  showAim(lng, lat);
  const card = document.getElementById("card");
  card.className = "card show";
  card.innerHTML = "<b>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</b><div class='icons'>" +
    ICONS.map(i => "<button type='button' data-i='" + i[0] + "'>" + i[1] + "</button>").join("") +
    "</div><div class='acts'><a href='https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng + "'>Naviga</a><button type='button' id='close'>Chiudi</button></div>";
  card.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const icon = ICONS.find(i => i[0] === b.dataset.i);
    spots.push({ uid: Date.now() + Math.random(), id: icon[0], lng, lat, emoji: icon[1], color: icon[2] });
    saveSpots();
    drawSpots();
    closeCard();
  });
  document.getElementById("close").onclick = closeCard;
});
</script>
</body>
</html>
