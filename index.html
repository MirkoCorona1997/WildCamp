<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WildCamp</title>
  <link rel="icon" href="icon-180.png" />
  <link href="maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #102019; }
    #map { position: absolute; inset: 0; }
    .bar {
      position: absolute; z-index: 2; top: calc(8px + env(safe-area-inset-top));
      left: 8px; right: 8px; display: flex; gap: 6px; align-items: center;
    }
    form { flex: 1; display: flex; min-width: 0; background: #fff; border-radius: 999px; overflow: hidden; }
    input { flex: 1; border: 0; outline: none; font: 14px system-ui, sans-serif; padding: 8px 12px; min-width: 0; }
    button { border: 0; background: #14241c; color: #f4ecdf; font: 600 13px system-ui, sans-serif; }
    form button { padding: 0 12px; }
    #here { border-radius: 999px; padding: 8px 10px; white-space: nowrap; }
    #ver { position: absolute; z-index: 2; top: calc(52px + env(safe-area-inset-top)); right: 10px; color: #5d564c; font: 10px system-ui; }
    .me { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 18px solid #1d6fd4; filter: drop-shadow(0 0 2px #fff); }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="bar">
    <form id="search">
      <input id="q" placeholder="Cerca in Sardegna" autocomplete="off" />
      <button type="submit">Vai</button>
    </form>
    <button type="button" id="here">Posizione</button>
  </div>
  <div id="ver">v19</div>
</div>
<script src="maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "© OpenStreetMap"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [9.05, 40.05],
  zoom: 7.4,
  maxBounds: [[7.9, 38.75], [10.0, 41.4]]
});
map.addControl(new maplibregl.NavigationControl(), "bottom-right");

document.getElementById("search").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&viewbox=7.9,41.4,10.0,38.75&bounded=1&q=" + encodeURIComponent(q + ", Sardegna");
  const rows = await (await fetch(url, { headers: { "Accept-Language": "it" } })).json();
  if (!rows[0]) return;
  map.flyTo({ center: [+rows[0].lon, +rows[0].lat], zoom: 13 });
};

let marker = null;
let heading = 0;
function arrow() {
  const el = document.createElement("div");
  el.className = "me";
  el.style.transform = "rotate(" + heading + "deg)";
  return el;
}
function place(lng, lat) {
  if (marker) marker.remove();
  marker = new maplibregl.Marker({ element: arrow(), rotationAlignment: "map" }).setLngLat([lng, lat]).addTo(map);
}
document.getElementById("here").onclick = () => {
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().catch(() => {});
  }
  navigator.geolocation.watchPosition((pos) => {
    const lng = pos.coords.longitude;
    const lat = pos.coords.latitude;
    if (pos.coords.heading != null && !Number.isNaN(pos.coords.heading)) heading = pos.coords.heading;
    place(lng, lat);
    map.easeTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14) });
  }, () => {}, { enableHighAccuracy: true });
};
window.addEventListener("deviceorientation", (e) => {
  if (e.webkitCompassHeading != null) heading = e.webkitCompassHeading;
  else if (e.alpha != null) heading = (360 - e.alpha) % 360;
  if (marker) place(marker.getLngLat().lng, marker.getLngLat().lat);
});
</script>
</body>
</html>
