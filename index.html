<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WildCamp</title>
  <link rel="icon" href="icon-180.png" />
  <link href="maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #app { margin: 0; height: 100%; background: #102019; }
    #map { position: absolute; inset: 0; }
    .bar {
      position: absolute; z-index: 2; top: calc(8px + env(safe-area-inset-top));
      left: 8px; right: 8px; display: flex; gap: 6px; align-items: center;
    }
    form { flex: 1; display: flex; min-width: 0; background: #fff; border-radius: 999px; overflow: hidden; }
    input { flex: 1; border: 0; outline: none; font: 14px system-ui, sans-serif; padding: 8px 12px; min-width: 0; }
    button { border: 0; background: #14241c; color: #f4ecdf; font: 600 13px system-ui, sans-serif; }
    form button { padding: 0 12px; }
    #here { border-radius: 999px; padding: 8px 10px; white-space: nowrap; }
    .bar { z-index: 8; }
    .sheet { z-index: 8; }
    #ver { position: absolute; z-index: 8; top: calc(52px + env(safe-area-inset-top)); right: 10px; color: #5d564c; font: 10px system-ui; }
    .card { position: absolute; z-index: 3; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); background: #fff; color: #14241c; border-radius: 16px; padding: 10px; display: none; font: 14px system-ui, sans-serif; }
    .card.show { display: block; }
    .card b { display: block; margin-bottom: 8px; }
    .icons, .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .icons button, .acts button, .acts a { border-radius: 999px; padding: 8px 10px; background: #efe6d8; color: #14241c; text-decoration: none; }
    .acts a { background: #e3a14a; }
    .pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .aim { width: 16px; height: 16px; border: 3px solid #e24b4b; border-radius: 50%; background: rgba(226,75,75,.25); box-shadow: 0 0 0 2px #fff; }
    .sheet { position: absolute; z-index: 3; left: 8px; right: 8px; top: calc(52px + env(safe-area-inset-top)); background: #fff; border-radius: 14px; padding: 8px; display: none; }
    .sheet.show { display: flex; gap: 6px; flex-wrap: wrap; }
    .sheet button { border-radius: 999px; padding: 6px 8px; background: #efe6d8; color: #14241c; }
    .sheet button.off { opacity: .35; }
    .me { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 18px solid #1d6fd4; filter: drop-shadow(0 0 2px #fff); }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="bar">
    <form id="search">
      <input id="q" placeholder="Cerca in Sardegna" autocomplete="off" />
      <button type="submit">Vai</button>
    </form>
    <button type="button" id="here">Posizione</button>
    <button type="button" id="filters">Filtri</button>
  </div>
  <div id="ver">v23</div>
  <section class="sheet" id="sheet"></section>
  <section class="card" id="card"></section>
</div>
<script src="maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "© OpenStreetMap"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [9.05, 40.05],
  zoom: 7.4,
  maxBounds: [[7.9, 38.75], [10.0, 41.4]]
});
map.addControl(new maplibregl.NavigationControl(), "bottom-right");

document.getElementById("search").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&viewbox=7.9,41.4,10.0,38.75&bounded=1&q=" + encodeURIComponent(q + ", Sardegna");
  const rows = await (await fetch(url, { headers: { "Accept-Language": "it" } })).json();
  if (!rows[0]) return;
  map.flyTo({ center: [+rows[0].lon, +rows[0].lat], zoom: 13 });
};

let marker = null;
let heading = 0;
function arrow() {
  const el = document.createElement("div");
  el.className = "me";
  el.style.transform = "rotate(" + heading + "deg)";
  return el;
}
function place(lng, lat) {
  if (marker) marker.remove();
  marker = new maplibregl.Marker({ element: arrow(), rotationAlignment: "map" }).setLngLat([lng, lat]).addTo(map);
}
document.getElementById("here").onclick = () => {
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().catch(() => {});
  }
  navigator.geolocation.watchPosition((pos) => {
    const lng = pos.coords.longitude;
    const lat = pos.coords.latitude;
    if (pos.coords.heading != null && !Number.isNaN(pos.coords.heading)) heading = pos.coords.heading;
    place(lng, lat);
    map.easeTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14) });
  }, () => {}, { enableHighAccuracy: true });
};
window.addEventListener("deviceorientation", (e) => {
  if (e.webkitCompassHeading != null) heading = e.webkitCompassHeading;
  else if (e.alpha != null) heading = (360 - e.alpha) % 360;
  if (marker) place(marker.getLngLat().lng, marker.getLngLat().lat);
});

const ICONS = [
  ["tenda", "⛺", "#2f8a60"],
  ["acqua", "💧", "#2d8ec8"],
  ["doccia", "🚿", "#3ec1c9"],
  ["cestino", "🗑️", "#7d9a52"],
  ["albero", "🌳", "#3f7d46"],
  ["domanda", "❓", "#c9a35c"]
];
const hidden = new Set(JSON.parse(localStorage.getItem("wildcamp-hidden") || "[]"));
let aim = null;
function hideAim() { if (aim) { aim.remove(); aim = null; } }
function showAim(lng, lat) {
  hideAim();
  const el = document.createElement("div");
  el.className = "aim";
  aim = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
}
function closeCard() {
  document.getElementById("card").className = "card";
  hideAim();
}
function openSpotCard(s) {
  const card = document.getElementById("card");
  card.className = "card show";
  card.innerHTML = "<b>" + s.lat.toFixed(5) + ", " + s.lng.toFixed(5) + "</b><div class='acts'><button type='button' id='del'>Togli segnaposto</button><a href='https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng + "'>Naviga</a><button type='button' id='close'>Chiudi</button></div>";
  document.getElementById("del").onclick = () => {
    const n = spots.findIndex(x => x.uid === s.uid);
    if (n >= 0) spots.splice(n, 1);
    localStorage.setItem("wildcamp-spots", JSON.stringify(spots));
    drawSpots();
    closeCard();
  };
  document.getElementById("close").onclick = closeCard;
}
function drawSpots() {
  pins.forEach(p => p.remove());
  pins.length = 0;
  spots.forEach((s) => {
    if (hidden.has(s.id)) return;
    const el = document.createElement("div");
    el.className = "pin";
    el.textContent = s.emoji;
    el.style.background = s.color;
    el.dataset.uid = String(s.uid);
    pins.push(new maplibregl.Marker({ element: el }).setLngLat([s.lng, s.lat]).addTo(map));
  });
}
document.getElementById("filters").onclick = (ev) => {
  ev.stopPropagation();
  const sheet = document.getElementById("sheet");
  const open = sheet.classList.toggle("show");
  if (!open) return;
  sheet.innerHTML = ICONS.map(i => "<button type='button' data-f='" + i[0] + "' class='" + (hidden.has(i[0]) ? "off" : "") + "'>" + i[1] + "</button>").join("");
  sheet.querySelectorAll("button").forEach(b => b.onclick = (ev2) => {
    ev2.stopPropagation();
    if (hidden.has(b.dataset.f)) hidden.delete(b.dataset.f); else hidden.add(b.dataset.f);
    localStorage.setItem("wildcamp-hidden", JSON.stringify([...hidden]));
    drawSpots();
    b.className = hidden.has(b.dataset.f) ? "off" : "";
  });
};
map.on("load", drawSpots);
map.on("click", (e) => {
  const pin = e.originalEvent && e.originalEvent.target && e.originalEvent.target.closest && e.originalEvent.target.closest(".pin");
  if (pin) {
    const s = spots.find(x => String(x.uid) === pin.dataset.uid);
    if (s) openSpotCard(s);
    return;
  }
  const lat = e.lngLat.lat;
  const lng = e.lngLat.lng;
  showAim(lng, lat);
  const card = document.getElementById("card");
  card.className = "card show";
  card.innerHTML = "<b>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</b><div class='icons'>" +
    ICONS.map(i => "<button type='button' data-i='" + i[0] + "'>" + i[1] + "</button>").join("") +
    "</div><div class='acts'><a href='https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng + "'>Naviga</a><button type='button' id='close'>Chiudi</button></div>";
  card.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const icon = ICONS.find(i => i[0] === b.dataset.i);
    spots.push({ uid: Date.now() + Math.random(), id: icon[0], lng, lat, emoji: icon[1], color: icon[2] });
    localStorage.setItem("wildcamp-spots", JSON.stringify(spots));
    drawSpots();
    closeCard();
  });
  document.getElementById("close").onclick = closeCard;
});
</script>
</body>
</html>
